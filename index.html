<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InnovianSearcher &ndash; ricerca nei PDF dei pazienti</title>
<style>
  :root{
    --blu:#1f6feb; --blu-scuro:#0b4ea2; --bg:#f4f6f9; --bordo:#d6dbe3;
    --testo:#1c2430; --grigio:#5b6675; --ok:#1a7f37; --warn:#9a6700;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--testo); font-size:15px; line-height:1.45;
  }
  header{background:linear-gradient(135deg,var(--blu),var(--blu-scuro)); color:#fff; padding:18px 22px;}
  header h1{margin:0; font-size:21px;}
  header p{margin:4px 0 0; opacity:.9; font-size:13px;}
  main{max-width:1080px; margin:18px auto; padding:0 16px 60px;}
  .card{background:#fff; border:1px solid var(--bordo); border-radius:12px; padding:18px 20px; margin-bottom:18px; box-shadow:0 1px 3px rgba(20,30,50,.05);}
  .card h2{margin:0 0 14px; font-size:16px; display:flex; align-items:center; gap:8px;}
  .step{display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--blu); color:#fff; font-size:13px; align-items:center; justify-content:center; font-weight:700;}
  label{font-weight:600; display:block; margin-bottom:5px;}
  .hint{color:var(--grigio); font-size:13px; font-weight:400;}
  .row{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start;}
  .row > div{flex:1; min-width:240px;}
  input[type=text], textarea, .filebox{
    width:100%; padding:9px 11px; border:1px solid var(--bordo); border-radius:8px; font:inherit; background:#fff;
  }
  textarea{resize:vertical; min-height:70px;}
  .filebox{display:flex; align-items:center; gap:10px; cursor:default;}
  .controls{display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin-top:6px;}
  .controls label{display:inline-flex; align-items:center; gap:6px; font-weight:500; margin:0;}
  button{
    background:var(--blu); color:#fff; border:none; padding:10px 18px; border-radius:8px;
    font:inherit; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--blu-scuro)}
  button:disabled{background:#aab3c0; cursor:not-allowed}
  button.secondary{background:#eef1f6; color:var(--testo); border:1px solid var(--bordo);}
  button.secondary:hover{background:#e2e7f0}
  .progress{height:14px; background:#e7ebf2; border-radius:7px; overflow:hidden; margin-top:10px;}
  .progress > div{height:100%; width:0; background:var(--blu); transition:width .15s;}
  .status{font-size:13px; color:var(--grigio); margin-top:6px; min-height:18px;}
  .disabled-block{opacity:.5; pointer-events:none;}
  table{width:100%; border-collapse:collapse; margin-top:6px;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--bordo); vertical-align:top;}
  th{background:#f0f3f8; font-size:13px;}
  tr.patient{cursor:pointer;}
  tr.patient:hover{background:#f5f8ff;}
  .pill{display:inline-block; background:#e8f0ff; color:var(--blu-scuro); border-radius:20px; padding:1px 9px; font-size:12px; margin:1px 3px 1px 0;}
  .pdflist{background:#fafbfd;}
  .pdflist a{color:var(--blu); cursor:pointer; text-decoration:none;}
  .pdflist a:hover{text-decoration:underline;}
  .empty{color:var(--grigio); padding:14px 4px;}
  .toggle-hint{font-size:12px; color:var(--grigio);}
  .badge{font-size:12px; background:#fff4d6; color:var(--warn); border:1px solid #f0dca0; border-radius:6px; padding:1px 7px;}
  .nowrap{white-space:nowrap;}
</style>
</head>
<body>
<header>
  <h1>InnovianSearcher</h1>
  <p>Ricerca termini nei PDF delle cartelle dei pazienti &mdash; gira tutto nel tuo browser, in locale, senza installare nulla e senza server.</p>
</header>

<main>
  <!-- 1) Cartelle -->
  <section class="card">
    <h2><span class="step">1</span> Scegli le cartelle</h2>
    <div class="controls" style="margin-bottom:14px;">
      <label><input type="radio" name="mode" value="medical" checked /> Diarie mediche (1 cartella)</label>
      <label><input type="radio" name="mode" value="nursing" /> Diarie infermieristiche (2 cartelle)</label>
    </div>
    <div class="row">
      <div>
        <label>Cartella pazienti <span class="hint">(contiene le cartelle <code>COGNOME_SDO</code>)</span></label>
        <div class="filebox">
          <input type="file" id="dir1" webkitdirectory directory multiple />
        </div>
        <div class="status" id="dir1info"></div>
      </div>
      <div id="dir2block">
        <label>Seconda cartella <span class="hint">(solo diarie infermieristiche)</span></label>
        <div class="filebox">
          <input type="file" id="dir2" webkitdirectory directory multiple disabled />
        </div>
        <div class="status" id="dir2info"></div>
      </div>
    </div>
    <div style="margin-top:14px;">
      <button id="loadBtn">Carica indici</button>
      <div class="progress"><div id="loadBar"></div></div>
      <div class="status" id="loadStatus">Nessun indice caricato.</div>
    </div>
  </section>

  <!-- 2) Ricerca -->
  <section class="card disabled-block" id="searchCard">
    <h2><span class="step">2</span> Imposta la ricerca</h2>
    <div class="row">
      <div style="flex:2;">
        <label>Termini da cercare <span class="hint">(separati da virgola, es. <code>febbre, tosse</code>)</span></label>
        <input type="text" id="terms" placeholder="febbre, tosse, antibiotico" />
        <div class="controls">
          <label><input type="radio" name="logic" value="OR" checked /> OR <span class="toggle-hint">(almeno un termine)</span></label>
          <label><input type="radio" name="logic" value="AND" /> AND <span class="toggle-hint">(tutti i termini nello stesso PDF)</span></label>
        </div>
        <div class="controls">
          <label>Errori di battitura tollerati:
            <select id="typos"><option>0</option><option>1</option><option selected>2</option></select>
          </label>
          <label><input type="checkbox" id="stopFirst" checked /> Fermati al primo PDF positivo per paziente</label>
        </div>
      </div>
      <div>
        <label>Filtro SDO <span class="hint">(uno per riga o separati da virgola; vuoto = tutti)</span></label>
        <textarea id="sdoFilter" placeholder="12345&#10;67890"></textarea>
      </div>
    </div>
    <div style="margin-top:14px;">
      <button id="searchBtn">Cerca</button>
      <button class="secondary" id="exportBtn" disabled>Esporta risultati (CSV)</button>
      <div class="progress"><div id="searchBar"></div></div>
      <div class="status" id="searchStatus"></div>
    </div>
  </section>

  <!-- 3) Risultati -->
  <section class="card">
    <h2><span class="step">3</span> Pazienti positivi</h2>
    <div id="resultsWrap">
      <div class="empty">Nessuna ricerca eseguita.</div>
    </div>
  </section>
</main>

<!-- Libreria pdf.js (Apache PDFBox per il browser): caricata da CDN, poi resta nella cache del browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- pdf.js worker ----
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  // ---- Elementi UI ----
  const $ = (id) => document.getElementById(id);
  const dir1 = $("dir1"), dir2 = $("dir2");
  const dir1info = $("dir1info"), dir2info = $("dir2info"), dir2block = $("dir2block");
  const loadBtn = $("loadBtn"), loadBar = $("loadBar"), loadStatus = $("loadStatus");
  const searchCard = $("searchCard"), searchBtn = $("searchBtn"), exportBtn = $("exportBtn");
  const searchBar = $("searchBar"), searchStatus = $("searchStatus");
  const resultsWrap = $("resultsWrap");

  let patients = [];        // [{cognome, sdo, folderName, files:[File], words: Map(File->Set)}]
  let lastResults = [];     // risultati ricerca correnti

  // ---- Modalita' 1 o 2 cartelle ----
  function currentMode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }
  function refreshMode() {
    const nursing = currentMode() === "nursing";
    dir2.disabled = !nursing;
    dir2block.style.opacity = nursing ? "1" : ".5";
    if (!nursing) { dir2.value = ""; dir2info.textContent = ""; }
  }
  document.querySelectorAll('input[name="mode"]').forEach((r) =>
    r.addEventListener("change", refreshMode));
  refreshMode();

  dir1.addEventListener("change", () => showPicked(dir1, dir1info));
  dir2.addEventListener("change", () => showPicked(dir2, dir2info));

  function showPicked(input, infoEl) {
    const pdfs = [...input.files].filter(isPdf);
    if (!input.files.length) { infoEl.textContent = ""; return; }
    const root = (input.files[0].webkitRelativePath || "").split("/")[0] || "(cartella)";
    infoEl.textContent = `Selezionata "${root}": ${pdfs.length} PDF trovati.`;
  }

  function isPdf(f) { return /\.pdf$/i.test(f.name); }

  // ---- Estrazione COGNOME_SDO ----
  function splitName(folderName) {
    const i = folderName.lastIndexOf("_");
    if (i > 0 && i < folderName.length - 1) {
      return { cognome: folderName.slice(0, i).trim(), sdo: folderName.slice(i + 1).trim() };
    }
    return { cognome: "", sdo: folderName.trim() };
  }

  // Raggruppa i file per cartella paziente (primo livello sotto la radice).
  function groupByPatient(fileLists) {
    const map = new Map(); // chiave sdo -> patient
    for (const files of fileLists) {
      for (const f of files) {
        if (!isPdf(f)) continue;
        const parts = (f.webkitRelativePath || f.name).split("/");
        // struttura attesa: radice / COGNOME_SDO / ... / file.pdf
        const folderName = parts.length >= 3 ? parts[1] : (parts.length === 2 ? parts[0] : "");
        if (!folderName) continue;
        const { cognome, sdo } = splitName(folderName);
        const key = sdo.toLowerCase();
        let p = map.get(key);
        if (!p) {
          p = { cognome, sdo, folderName, files: [], words: new Map() };
          map.set(key, p);
        }
        p.files.push(f);
      }
    }
    const arr = [...map.values()];
    arr.sort((a, b) => a.folderName.toLowerCase().localeCompare(b.folderName.toLowerCase(), "it"));
    return arr;
  }

  // ---- Tokenizzazione ----
  const WORD_RE = /[\p{L}\p{N}]+/gu;
  function tokenize(text) {
    const set = new Set();
    if (!text) return set;
    const m = text.toLowerCase().match(WORD_RE);
    if (m) for (const w of m) set.add(w);
    return set;
  }
  function normalizeTerm(t) {
    const m = (t || "").toLowerCase().match(WORD_RE);
    return m ? m.join("") : "";
  }

  // ---- Distanza di Levenshtein con uscita anticipata ----
  function withinDistance(a, b, max) {
    if (a === b) return true;
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > max) return false;
    if (la === 0) return lb <= max;
    if (lb === 0) return la <= max;
    let prev = new Array(lb + 1), curr = new Array(lb + 1);
    for (let j = 0; j <= lb; j++) prev[j] = j;
    for (let i = 1; i <= la; i++) {
      curr[0] = i;
      let rowMin = curr[0];
      const ca = a.charCodeAt(i - 1);
      for (let j = 1; j <= lb; j++) {
        const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
        const v = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
        curr[j] = v;
        if (v < rowMin) rowMin = v;
      }
      if (rowMin > max) return false;
      const tmp = prev; prev = curr; curr = tmp;
    }
    return prev[lb] <= max;
  }

  // ---- Lettura testo da un PDF ----
  async function extractWords(file) {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = "";
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      text += " " + content.items.map((it) => (it.str || "")).join(" ");
    }
    await doc.destroy();
    return tokenize(text);
  }

  // ---- Caricamento indici ----
  let loading = false;
  loadBtn.addEventListener("click", loadIndices);

  async function loadIndices() {
    if (loading) return;
    if (!window.pdfjsLib) {
      loadStatus.innerHTML = '<span class="badge">Libreria PDF non caricata</span> ' +
        "verifica il collegamento a Internet (serve solo al primo avvio) e ricarica la pagina.";
      return;
    }
    const lists = [[...dir1.files]];
    if (currentMode() === "nursing") lists.push([...dir2.files]);
    if (!lists[0].length) {
      loadStatus.textContent = "Seleziona almeno una cartella.";
      return;
    }

    patients = groupByPatient(lists);
    const total = patients.reduce((s, p) => s + p.files.length, 0);
    if (total === 0) {
      loadStatus.textContent = "Nessun PDF trovato nelle cartelle selezionate.";
      return;
    }

    loading = true;
    loadBtn.disabled = true;
    let done = 0, errors = 0;
    setBar(loadBar, 0);
    loadStatus.textContent = `Pazienti: ${patients.length} \u2013 PDF da leggere: ${total}`;

    for (const p of patients) {
      for (const f of p.files) {
        try {
          p.words.set(f, await extractWords(f));
        } catch (e) {
          p.words.set(f, new Set());
          errors++;
        }
        done++;
        if (done % 2 === 0 || done === total) {
          setBar(loadBar, (done / total) * 100);
          loadStatus.textContent =
            `Indicizzazione ${done}/${total} \u2013 ${p.folderName} / ${f.name}`;
          await sleep(0); // lascia aggiornare l'interfaccia
        }
      }
    }

    setBar(loadBar, 100);
    loadStatus.innerHTML = `Indice pronto: <b>${patients.length}</b> pazienti, <b>${total}</b> PDF` +
      (errors ? ` &nbsp;<span class="badge">${errors} PDF non leggibili</span>` : "");
    searchCard.classList.remove("disabled-block");
    loading = false;
    loadBtn.disabled = false;
  }

  // ---- Ricerca ----
  searchBtn.addEventListener("click", runSearch);

  async function runSearch() {
    if (!patients.length) return;
    const terms = $("terms").value.split(",").map(normalizeTerm).filter(Boolean);
    if (!terms.length) { searchStatus.textContent = "Inserisci almeno un termine."; return; }

    const logic = document.querySelector('input[name="logic"]:checked').value;
    const maxTypos = parseInt($("typos").value, 10);
    const stopFirst = $("stopFirst").checked;
    const sdoSet = new Set($("sdoFilter").value.split(/[\s,;]+/).map((s) => s.trim().toLowerCase()).filter(Boolean));
    const uniqueTermCount = new Set(terms).size;

    searchBtn.disabled = true;
    setBar(searchBar, 0);
    lastResults = [];

    const total = patients.length;
    let idx = 0;
    for (const p of patients) {
      idx++;
      if (sdoSet.size && !sdoSet.has(p.sdo.toLowerCase())) continue;

      const matchedPdfs = [];
      for (const f of p.files) {
        const words = p.words.get(f);
        if (!words || !words.size) continue;
        const found = matchPdf(words, terms, maxTypos);
        const positive = logic === "OR" ? found.size > 0 : found.size === uniqueTermCount;
        if (positive) {
          matchedPdfs.push({ file: f, terms: [...found] });
          if (stopFirst) break;
        }
      }
      if (matchedPdfs.length) lastResults.push({ patient: p, matchedPdfs });

      if (idx % 10 === 0 || idx === total) {
        setBar(searchBar, (idx / total) * 100);
        await sleep(0);
      }
    }

    setBar(searchBar, 100);
    renderResults(lastResults);
    searchStatus.textContent = `Trovati ${lastResults.length} pazienti positivi.`;
    exportBtn.disabled = lastResults.length === 0;
    searchBtn.disabled = false;
  }

  function matchPdf(words, terms, maxTypos) {
    const found = new Set();
    for (const term of terms) {
      if (words.has(term)) { found.add(term); continue; }
      const allowed = Math.min(maxTypos, Math.max(0, term.length - 1));
      if (allowed <= 0) continue;
      for (const w of words) {
        if (Math.abs(w.length - term.length) > allowed) continue;
        if (withinDistance(term, w, allowed)) { found.add(term); break; }
      }
    }
    return found;
  }

  // ---- Render risultati ----
  function renderResults(results) {
    if (!results.length) {
      resultsWrap.innerHTML = '<div class="empty">Nessun paziente positivo per questa ricerca.</div>';
      return;
    }
    const table = document.createElement("table");
    table.innerHTML =
      "<thead><tr><th>Cognome</th><th>SDO</th><th class='nowrap'>PDF positivi</th><th>Termini trovati</th></tr></thead>";
    const tbody = document.createElement("tbody");

    results.forEach((res, i) => {
      const tr = document.createElement("tr");
      tr.className = "patient";
      tr.innerHTML =
        `<td>${esc(res.patient.cognome) || "<i>(senza cognome)</i>"}</td>` +
        `<td>${esc(res.patient.sdo)}</td>` +
        `<td style="text-align:center">${res.matchedPdfs.length}</td>` +
        `<td>${[...new Set(res.matchedPdfs.flatMap((m) => m.terms))].map((t) => `<span class="pill">${esc(t)}</span>`).join("")}</td>`;
      const detail = document.createElement("tr");
      detail.className = "pdflist";
      detail.style.display = "none";
      const td = document.createElement("td");
      td.colSpan = 4;
      td.innerHTML =
        `<div><b>Cartella:</b> ${esc(res.patient.folderName)}</div>` +
        "<div style='margin-top:6px'><b>PDF (giornate) positive &ndash; clicca per aprire:</b></div>" +
        "<ul style='margin:6px 0 0 18px'>" +
        res.matchedPdfs.map((m) =>
          `<li><a data-open="1">${esc(m.file.name)}</a> ` +
          `<span class="hint">[${m.terms.map(esc).join(", ")}]</span></li>`).join("") +
        "</ul>";
      detail.appendChild(td);

      tr.addEventListener("click", () => {
        detail.style.display = detail.style.display === "none" ? "" : "none";
      });
      // apertura dei PDF
      td.querySelectorAll('a[data-open]').forEach((a, k) => {
        a.addEventListener("click", (ev) => {
          ev.stopPropagation();
          openFile(res.matchedPdfs[k].file);
        });
      });

      tbody.appendChild(tr);
      tbody.appendChild(detail);
    });

    table.appendChild(tbody);
    resultsWrap.innerHTML = "";
    resultsWrap.appendChild(table);
  }

  function openFile(file) {
    const url = URL.createObjectURL(file);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // ---- Esportazione CSV ----
  exportBtn.addEventListener("click", () => {
    if (!lastResults.length) return;
    const rows = ["Cognome;SDO;PDF positivi;Termini trovati;Cartella;File positivi"];
    for (const r of lastResults) {
      const termini = [...new Set(r.matchedPdfs.flatMap((m) => m.terms))].join(" ");
      const files = r.matchedPdfs.map((m) => m.file.name).join(" | ");
      rows.push([
        csv(r.patient.cognome), csv(r.patient.sdo), r.matchedPdfs.length,
        csv(termini), csv(r.patient.folderName), csv(files)
      ].join(";"));
    }
    const blob = new Blob(["\uFEFF" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "risultati_ricerca.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });

  // ---- Utilita' ----
  function setBar(el, pct) { el.style.width = Math.max(0, Math.min(100, pct)) + "%"; }
  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function csv(s) {
    return String(s == null ? "" : s).replace(/;/g, ",").replace(/[\r\n]+/g, " ");
  }
})();
</script>
</body>
</html>
